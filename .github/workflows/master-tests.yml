name: tests for latest PHP

on:
#  push:
#  pull_request:
  workflow_dispatch:
  schedule:
    # upstream shivammathur/php-builder* run at 23:30+0000 per day
    - cron:  '42 3 * * *'

jobs:
  linux-tests:
    name: PHP latest Test on ubuntu-latest
    runs-on: "ubuntu-latest"

    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:latest
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup extension dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -yqq libcurl4-openssl-dev
          openssl rand -writerand "$HOME/.rnd"

      - name: Setup PHP
        uses: shivammathur/setup-php@master
        with:
          php-version: '8.5'
          tools: phpize
          # ini-values: pcov.directory=lib
          # coverage: pcov
          coverage: none
          extensions: curl,openssl,sockets,ffi,pdo,pdo_pgsql

      - name: Setup composer dependencies
        run: composer update -o --ignore-platform-reqs

      - name: Build Swow extension
        run: |
          cd ext
          printf "\033[1mRun phpize\033[0m\n"
          phpize
          printf "\033[1mStart configure\033[0m\n"
          ./configure --enable-swow\
            --enable-swow-debug \
            --enable-swow-ssl \
            --enable-swow-curl \
            --enable-swow-pdo-pgsql
          printf "\033[1mStart build Swow\033[0m\n"
          make -j`nproc`
          printf "\033[1mDone build Swow\033[0m\n"
          php -d extension=.libs/swow.so --ri swow
          printf "\033[1mInstall Swow\033[0m\n"
          sudo make install-modules

      - name: Run extension tests
        id: test-extension
        continue-on-error: true
        run: |
          TEST_SWOW_POSTGRESQL=1 composer test-extension .

      - name: Run library tests
        id: test-library
        continue-on-error: true
        run: composer test-library

      - name: Fail if test-extension failed
        if: steps.test-extension.outcome != 'success'
        run: exit 1

      - name: Fail if test-library failed
        if: steps.test-library.outcome != 'success'
        run: exit 1

  macos-tests:
    name: PHP latest Test on macos-latest
    runs-on: "macos-latest"
    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup extension dependencies
        run: |
          # [ ! -d /opt/homebrew/Cellar/pkgconf* ] && brew install pkgconf
          [ ! -d /opt/homebrew/Cellar/openssl@3 ] && brew install openssl@3
          [ ! -d /opt/homebrew/Cellar/curl* ] && brew install curl
          [ ! -d /opt/homebrew/Cellar/postgresql* ] && brew install libpq postgresql
          initdb --locale=C -E UTF-8 -U postgres "$HOME/pgsqldata"
          pg_ctl -D "$HOME/pgsqldata" start
          openssl rand -writerand "$HOME/.rnd"

      - name: Setup PHP
        uses: shivammathur/setup-php@master
        with:
          php-version: '8.5'
          tools: phpize
          # ini-values: pcov.directory=lib
          # coverage: pcov
          coverage: none
          extensions: curl,openssl,sockets,ffi,pdo,pdo_pgsql

      - name: Setup composer dependencies
        run: |
          composer update -o --ignore-platform-reqs
          # for arm64 machines:
          # Warning: JIT on AArch64 doesn't support opcache.jit_buffer_size above 128M. in Unknown on line 0
          if uname -m | grep -q -e arm64 -e aarch64; then
            phpini="$(php --ini | sed -n 's/Loaded Configuration File:[[:space:]]*//p' | sed -E 's/^"//; s/"$//')"
            sed -i -E 's/opcache.jit_buffer_size=.+/opcache.jit_buffer_size=128M/g' "$phpini"
            configdir="$(php --ini | sed -n 's/Scan for additional .ini files in:[[:space:]]*//p' | sed -E 's/^"//; s/"$//')"
            for f in $(find "$configdir" -name '*.ini' -type f || true); do
              sed -i -E 's/opcache.jit_buffer_size=.+/opcache.jit_buffer_size=128M/g' "$f"
            done
          fi

      - name: Detect dependencies path from php-config
        run: |
          linked_libraries=''
          collect_linked_libraries() {
            loader_dir=$(dirname "$1")
            linked_libraries="$linked_libraries
          $(otool -L "$1" | awk -v loader_dir="$loader_dir" 'NR > 1 { sub("^@loader_path", loader_dir, $1); print $1 }')"
          }
          collect_linked_libraries "$(php -r 'echo PHP_BINARY;')"
          extension_dir=$(php-config --extension-dir)
          for extension in openssl curl pdo_pgsql; do
            if [ -f "$extension_dir/$extension.so" ]; then
              collect_linked_libraries "$extension_dir/$extension.so"
            fi
          done
          printf '%s\n' "$linked_libraries"
          dependency_prefix() {
            library=$(printf '%s\n' "$linked_libraries" | awk -v name="$1" '$1 ~ "/lib" name "([.][0-9]+)+[.]dylib$" { print $1; exit }')
            if [ -z "$library" ] || [ ! -f "$library" ]; then
              echo "Cannot locate PHP's $1 library" >&2
              return 1
            fi
            prefix=$(cd "$(dirname "$(dirname "$library")")" && pwd -P)
            if [ ! -d "$prefix/include" ] || [ ! -d "$prefix/lib/pkgconfig" ]; then
              echo "Missing development files for $library" >&2
              return 1
            fi
            printf '%s\n' "$prefix"
          }
          # Use PHP's linked dependencies to avoid building and running with different OpenSSL versions in Cellar.
          openssl_root=$(dependency_prefix ssl)
          curl_root=$(dependency_prefix curl)
          pgsql_root=$(dependency_prefix pq)
          printf 'OPENSSL_ROOT_DIR=%s\nCURL_ROOT_DIR=%s\nPGSQL_ROOT_DIR=%s\n' "$openssl_root" "$curl_root" "$pgsql_root" >> "$GITHUB_ENV"

      - name: Build Swow extension
        env:
          CFLAGS: -I${{ env.OPENSSL_ROOT_DIR }}/include ${{ env.CFLAGS }}
          CPPFLAGS: -I${{ env.OPENSSL_ROOT_DIR }}/include ${{ env.CPPFLAGS }}
          LDFLAGS: -L${{ env.OPENSSL_ROOT_DIR }}/lib ${{ env.LDFLAGS }}
          PKG_CONFIG_PATH: ${{ env.OPENSSL_ROOT_DIR }}/lib/pkgconfig:${{ env.PKG_CONFIG_PATH }}
        run: |
          cd ext
          printf "\033[1mRun phpize\033[0m\n"
          phpize
          printf "\033[1mStart configure\033[0m\n"
          ./configure --enable-swow\
            --enable-swow-debug \
            --enable-swow-ssl=${{ env.OPENSSL_ROOT_DIR }} \
            --enable-swow-curl=${{ env.CURL_ROOT_DIR }} \
            --enable-swow-pdo-pgsql=${{ env.PGSQL_ROOT_DIR }}
          printf "\033[1mStart build Swow\033[0m\n"
          make -j`sysctl -n hw.logicalcpu`
          printf "\033[1mDone build Swow\033[0m\n"
          php -d extension=.libs/swow.so --ri swow
          printf "\033[1mInstall Swow\033[0m\n"
          make install-modules

      - name: Run extension tests
        id: test-extension
        continue-on-error: true
        run: |
          TEST_SWOW_POSTGRESQL=1 composer test-extension .

      - name: Run library tests
        id: test-library
        continue-on-error: true
        run: composer test-library

      - name: Fail if test-extension failed
        if: steps.test-extension.outcome != 'success'
        run: exit 1

      - name: Fail if test-library failed
        if: steps.test-library.outcome != 'success'
        run: exit 1

  windows-tests:
    name: PHP latest ${{ matrix.ts }} Test on Windows
    runs-on: "${{ matrix.os }}"
    strategy:
      fail-fast: false
      matrix:
        os: ['windows-2022']
        ts: [ 'nts', 'ts' ]
      max-parallel: 2
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # TODO: windows varient of setup-php seems to be so slow
      #       shell we add caches?
      - name: Setup PHP
        uses: shivammathur/setup-php@master
        with:
          php-version: '8.5'
          # ini-values: pcov.directory=lib
          # coverage: pcov
          coverage: none
          extensions: curl,openssl,pdo,pdo_pgsql
        env:
          phpts: ${{ matrix.ts }}

      - name: Build Swow extension
        uses: ./.github/workflows/winext
        with:
          phpver: '8.5'
          phpts: ${{ matrix.ts == 'ts' && '1' || '0' }}
          ext-path: ./ext
          tools-path: C:\tools\phpdev
          conf-args: --enable-swow-debug --enable-swow-ssl --enable-swow-curl --enable-swow-pdo-pgsql
          ext-name: swow
          staging-deps: '1'
          deps: openssl,libcurl,libssh2,zlib,nghttp2,libpq,brotli,libzstd

      - name: Setup composer dependencies
        run: composer update -o --ignore-platform-reqs

      - name: Run extension tests
        shell: pwsh
        id: test-extension
        continue-on-error: true
        run: |
          & "${env:PGBIN}\initdb.exe" --locale=C -E UTF-8 -U postgres "C:\pgsqldata"
          & "${env:PGBIN}\pg_ctl.exe" -D "C:\pgsqldata" start
          ${env:TEST_SWOW_POSTGRESQL} = "1"
          composer test-extension .

      - name: Run library tests
        shell: cmd
        id: test-library
        continue-on-error: true
        run: composer test-library

      - name: Fail if test-extension failed
        if: steps.test-extension.outcome != 'success'
        run: exit 1

      - name: Fail if test-library failed
        if: steps.test-library.outcome != 'success'
        run: exit 1
