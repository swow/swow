name: tests for common distros

on:
  workflow_dispatch:
  schedule:
    - cron:  '42 3 * * *'

jobs:
  distro-tests:
    name: Build tests for PHP ${{ matrix.php-version }} on ${{ matrix.distro.name }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: [ '8.5', '8.4', '8.3', '8.2', '8.1' ]
        distro:
          # CentOS 7 died
          # - name: CentOS 7
          #   image: centos:7
          #   pkg: yum
          # CentOS 8 died
          #- name: CentOS 8
          #  image: centos:8
          #  pkg: yum
          - name: AlmaLinux 8
            image: quay.io/almalinuxorg/8-base:8
            pkg: dnf
          - name: Rocky Linux 8
            image: quay.io/rockylinux/rockylinux:8
            pkg: dnf
          - name: AlmaLinux 9
            image: quay.io/almalinuxorg/9-base:9
            pkg: dnf
          - name: Rocky Linux 9
            image: quay.io/rockylinux/rockylinux:9
            pkg: dnf
          - name: AlmaLinux 10
            image: quay.io/almalinuxorg/10-base:10
            pkg: dnf
          - name: Rocky Linux 10
            image: quay.io/rockylinux/rockylinux:10
            pkg: dnf
          - name: Fedora
            image: registry.fedoraproject.org/fedora:latest
            pkg: dnf
          - name: Fedora rawhide
            image: registry.fedoraproject.org/fedora:rawhide
            pkg: dnf
          - name: Archlinux
            image: quay.io/archlinux/archlinux:latest
            pkg: pacman
          - name: Alpine
            image: public.ecr.aws/docker/library/alpine:latest
            pkg: apk
          - name: Alpine Edge
            image: public.ecr.aws/docker/library/alpine:edge
            pkg: apk
          - name: Debian
            image: public.ecr.aws/docker/library/debian:stable-slim
            pkg: apt
          - name: Debian sid
            image: public.ecr.aws/docker/library/debian:sid-slim
            pkg: apt
          - name: openSUSE Leap
            image: registry.opensuse.org/opensuse/leap:latest
            pkg: zypper
          - name: openSUSE Tumbleweed
            image: registry.opensuse.org/opensuse/tumbleweed:latest
            pkg: zypper
            privileged: true
      max-parallel: 12
      fail-fast: false
    steps:
      - name: Prepare Swow codes
        uses: actions/checkout@v4
        with:
          path: swow
          persist-credentials: false

      - name: Prepare cache PHP source
        id: cacheprepare
        shell: bash
        run: |
          infojson=$(curl 'https://www.php.net/releases/?json&version=${{ matrix.php-version }}')
          if [ "$(echo "$infojson" | jq -r '.error')" != 'null' ]
          then
            echo ::warning::PHP version ${{ matrix.php-version }} is not found in releases, it may not be released.
          else
            echo phpfn="$(
              echo "${infojson}" |
                jq -r '.source[] |select( .filename | endswith("tar.xz")) | .filename'
            )" >> $GITHUB_OUTPUT
          fi

      - name: Cache PHP codes
        if: steps.cacheprepare.outputs.phpfn
        uses: actions/cache@v4
        with:
          key: phpcode-v3-${{steps.cacheprepare.outputs.phpfn}}
          path: |
            ${{steps.cacheprepare.outputs.phpfn}}

      - name: Prepare PHP codes
        shell: bash
        run: |
          fn='${{steps.cacheprepare.outputs.phpfn}}'
          if [ "$fn" != "" ]
          then
            if [ ! -f "$fn" ]
            then
              wget https://www.php.net/distributions/${fn}
            fi
            mkdir php-src
            tar xf "${fn}" -C php-src --strip-components=1
          else
            git clone --single-branch --branch PHP-${{ matrix.php-version }} --depth 1 https://github.com/php/php-src php-src
          fi
          cd php-src
          curl https://github.com/php/php-src/commit/a9f172466d2a7ddda192d116b4a5a2b1577a45cc.patch | patch -p1 || :
          curl https://github.com/php/php-src/commit/577b8ae4226368e66fee7a9b5c58f9e2428372fc.patch | patch -p1 || :
          if [ '${{ matrix.php-version }}' = '8.1' ]; then
            curl --fail --silent --show-error --location --retry 3 \
              https://github.com/php/php-src/commit/19255f4b784cedf6dd4bb21e97def348d335dd69.patch \
              --output openssl4.patch
            git apply --include='ext/openssl/*' --check openssl4.patch
            git apply --include='ext/openssl/*' openssl4.patch
          fi
          
      - name: Build things
        run: |
          docker run --rm --name testcontainer \
            ${{ matrix.distro.privileged && '--privileged' || '' }} \
            --cap-add=SYS_NICE \
            --cap-add=IPC_LOCK \
            -v `realpath php-src`:/src/php-src:rw,rshared \
            -v `realpath swow`:/src/swow:rw,rshared \
            -v `realpath swow/.github/workflows/distro-installer.sh`:/distro-installer.sh:ro \
            -e CI=true \
            ${{ matrix.distro.image }} ${{ matrix.distro.pkg == 'apt' && '/bin/bash ' || ''}}/distro-installer.sh ${{ matrix.distro.pkg }}
