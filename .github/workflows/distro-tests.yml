name: tests for common distros

on:
  workflow_dispatch:
  schedule:
    - cron:  '42 3 * * *'

jobs:
  distro-tests:
    name: Build tests for PHP ${{ matrix.php-version }} on ${{ matrix.distro.name }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: [ '8.5', '8.4', '8.3', '8.2', '8.1' ]
        distro:
          # CentOS 7 died
          # - name: CentOS 7
          #   image: centos:7
          #   pkg: yum
          # CentOS 8 died
          #- name: CentOS 8
          #  image: centos:8
          #  pkg: yum
          - name: AlmaLinux 8
            image: quay.io/almalinuxorg/8-base:8
            pkg: dnf
          - name: Rocky Linux 8
            image: quay.io/rockylinux/rockylinux:8
            pkg: dnf
          - name: AlmaLinux 9
            image: quay.io/almalinuxorg/9-base:9
            pkg: dnf
          - name: Rocky Linux 9
            image: quay.io/rockylinux/rockylinux:9
            pkg: dnf
          - name: AlmaLinux 10
            image: quay.io/almalinuxorg/10-base:10
            pkg: dnf
          - name: Rocky Linux 10
            image: quay.io/rockylinux/rockylinux:10
            pkg: dnf
          - name: Fedora
            image: registry.fedoraproject.org/fedora:latest
            pkg: dnf
          - name: Fedora rawhide
            image: registry.fedoraproject.org/fedora:rawhide
            pkg: dnf
          - name: Archlinux
            image: quay.io/archlinux/archlinux:latest
            pkg: pacman
          - name: Alpine
            image: public.ecr.aws/docker/library/alpine:latest
            fallback-images: mirror.gcr.io/library/alpine:latest docker.io/library/alpine:latest
            pkg: apk
          - name: Alpine Edge
            image: public.ecr.aws/docker/library/alpine:edge
            fallback-images: mirror.gcr.io/library/alpine:edge docker.io/library/alpine:edge
            pkg: apk
          - name: Debian
            image: public.ecr.aws/docker/library/debian:stable-slim
            fallback-images: mirror.gcr.io/library/debian:stable-slim docker.io/library/debian:stable-slim
            pkg: apt
          - name: Debian sid
            image: public.ecr.aws/docker/library/debian:sid-slim
            fallback-images: mirror.gcr.io/library/debian:sid-slim docker.io/library/debian:sid-slim
            pkg: apt
          - name: openSUSE Leap
            image: registry.opensuse.org/opensuse/leap:latest
            pkg: zypper
          - name: openSUSE Tumbleweed
            image: registry.opensuse.org/opensuse/tumbleweed:latest
            pkg: zypper
            privileged: true
      max-parallel: 12
      fail-fast: false
    steps:
      - name: Prepare Swow codes
        uses: actions/checkout@v4
        with:
          path: swow
          persist-credentials: false

      - name: Prepare cache PHP source
        id: cacheprepare
        shell: bash
        run: |
          infojson=$(curl 'https://www.php.net/releases/?json&version=${{ matrix.php-version }}')
          if [ "$(echo "$infojson" | jq -r '.error')" != 'null' ]
          then
            echo ::warning::PHP version ${{ matrix.php-version }} is not found in releases, it may not be released.
          else
            echo phpfn="$(
              echo "${infojson}" |
                jq -r '.source[] |select( .filename | endswith("tar.xz")) | .filename'
            )" >> $GITHUB_OUTPUT
          fi

      - name: Cache PHP codes
        if: steps.cacheprepare.outputs.phpfn
        uses: actions/cache@v4
        with:
          key: phpcode-v3-${{steps.cacheprepare.outputs.phpfn}}
          path: |
            ${{steps.cacheprepare.outputs.phpfn}}

      - name: Prepare PHP codes
        shell: bash
        run: |
          fn='${{steps.cacheprepare.outputs.phpfn}}'
          if [ "$fn" != "" ]
          then
            if [ ! -f "$fn" ]
            then
              wget https://www.php.net/distributions/${fn}
            fi
            mkdir php-src
            tar xf "${fn}" -C php-src --strip-components=1
          else
            git clone --single-branch --branch PHP-${{ matrix.php-version }} --depth 1 https://github.com/php/php-src php-src
          fi
          cd php-src
          curl https://github.com/php/php-src/commit/a9f172466d2a7ddda192d116b4a5a2b1577a45cc.patch | patch -p1 || :
          curl https://github.com/php/php-src/commit/577b8ae4226368e66fee7a9b5c58f9e2428372fc.patch | patch -p1 || :
          if [ '${{ matrix.php-version }}' = '8.1' ]; then
            curl --fail --silent --show-error --location --retry 3 \
              https://github.com/php/php-src/commit/19255f4b784cedf6dd4bb21e97def348d335dd69.patch \
              --output openssl4.patch
            git apply --include='ext/openssl/*' --check openssl4.patch
            git apply --include='ext/openssl/*' openssl4.patch
          fi
          
      - name: Pull distro image
        env:
          DISTRO_IMAGE: ${{ matrix.distro.image }}
          # Other public sources of the same official image, tried in order when the
          # primary registry keeps throttling.
          FALLBACK_IMAGES: ${{ matrix.distro.fallback-images }}
        run: |
          # Pull one image, retrying only throttling and transient transport errors.
          # Returns 0 on success, 75 when retries are exhausted or the registry
          # throttles, and docker's own status for permanent errors.
          pull_with_retry() {
            local image=$1 output status attempt
            for attempt in {1..5}; do
              if output=$(docker pull "$image" 2>&1); then
                printf '%s\n' "$output"
                return 0
              else
                status=$?
              fi
              printf '%s\n' "$output"
              if ! echo "$output" | grep -Eqi 'toomanyrequests|too many requests|rate exceeded|data limit exceeded|429|5[0-9]{2} (bad gateway|service unavailable|gateway timeout)|unexpected EOF|connection reset|TLS handshake timeout|i/o timeout'; then
                return "$status"
              fi
              # ECR Public answers "Data limit exceeded" once the anonymous quota of the
              # runner's shared address is used up; waiting a few seconds does not help.
              if echo "$output" | grep -qi 'data limit exceeded'; then
                return 75
              fi
              if [ "$attempt" -lt 5 ]; then
                sleep "$((2 ** attempt))"
              fi
            done
            return 75
          }

          status=0
          pull_with_retry "$DISTRO_IMAGE" || status=$?
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          if [ "$status" -ne 75 ]; then
            exit "$status"
          fi
          for fallback in $FALLBACK_IMAGES; do
            echo "::warning::Pulling $DISTRO_IMAGE failed, trying $fallback"
            if pull_with_retry "$fallback"; then
              # The build step runs the image by its primary name.
              docker tag "$fallback" "$DISTRO_IMAGE"
              exit 0
            fi
          done
          exit 1

      - name: Build things
        run: |
          docker run --rm --name testcontainer \
            ${{ matrix.distro.privileged && '--privileged' || '' }} \
            --cap-add=SYS_NICE \
            --cap-add=IPC_LOCK \
            -v `realpath php-src`:/src/php-src:rw,rshared \
            -v `realpath swow`:/src/swow:rw,rshared \
            -v `realpath swow/.github/workflows/distro-installer.sh`:/distro-installer.sh:ro \
            -e CI=true \
            ${{ matrix.distro.image }} ${{ matrix.distro.pkg == 'apt' && '/bin/bash ' || ''}}/distro-installer.sh ${{ matrix.distro.pkg }}
